<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CURIÓ — teste privado do Storage</title>
<style>
  :root{color-scheme:dark;font:16px system-ui;background:#10151d;color:#eaf0f7}
  body{max-width:650px;margin:3rem auto;padding:0 1rem}
  h1{font-size:1.6rem} p{line-height:1.5;color:#bdcad8}
  label{display:block;margin:1rem 0} input{display:block;box-sizing:border-box;width:100%;padding:.75rem;border:1px solid #516174;border-radius:8px;background:#182331;color:white;font:inherit}
  button{padding:.8rem 1.2rem;background:#82d1ac;border:0;border-radius:8px;color:#102019;font-weight:700;cursor:pointer}
  button:disabled{opacity:.5} li{margin:.6rem 0} .ok{color:#94dfae}.bad{color:#ff9f9f}.info{color:#c5d8ee}
</style>
<h1>Teste de isolamento das fotos</h1>
<p>Esta página roda só no seu navegador. As senhas e tokens ficam na memória durante o teste; não são salvos nem enviados ao CURIÓ. Use apenas as duas contas de teste, nunca sua coleção real.</p>
<label>Chave publicável do projeto (<code>sb_publishable_...</code>)
  <input id="key" autocomplete="off" spellcheck="false" required></label>
<label>E-mail da conta A<input id="emailA" type="email" autocomplete="username" required></label>
<label>Senha da conta A<input id="passA" type="password" autocomplete="off" required></label>
<label>E-mail da conta B<input id="emailB" type="email" autocomplete="username" required></label>
<label>Senha da conta B<input id="passB" type="password" autocomplete="off" required></label>
<button id="run">Executar teste</button>
<ol id="log" aria-live="polite"></ol>
<script>
(() => {
  'use strict';
  const BASE = 'https://xyuqdpenhnlwnplisxjh.supabase.co';
  const BUCKET = 'figure-photos';
  const $ = id => document.getElementById(id);
  const log = (message, cls='info') => {
    const item=document.createElement('li');
    item.className=cls; item.textContent=message; $('log').append(item);
  };
  async function request(url, method, key, token, body, contentType) {
    const headers={apikey:key};
    if(token) headers.Authorization='Bearer '+token;
    if(contentType) headers['Content-Type']=contentType;
    return fetch(BASE+url,{method,headers,body,cache:'no-store'});
  }
  async function login(email,password,key) {
    const response=await request('/auth/v1/token?grant_type=password','POST',key,null,
      JSON.stringify({email,password}),'application/json');
    const result=await response.json();
    if(!response.ok || !result.access_token || !result.user?.id)
      throw Error('Falha no login de '+email+' (HTTP '+response.status+'). Verifique senha e confirmação do e-mail.');
    return {id:result.user.id,token:result.access_token};
  }
  function path(id,nonce){return id+'/curio-storage-test-'+nonce+'.png'}
  function objectUrl(p){return '/storage/v1/object/authenticated/'+BUCKET+'/'+p}
  const tinyPng=Uint8Array.from(atob('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+a1ZkAAAAASUVORK5CYII='),c=>c.charCodeAt(0));
  async function upload(p,key,token) {
    return request('/storage/v1/object/'+BUCKET+'/'+p,'POST',key,token,
      tinyPng,'image/png');
  }
  async function download(p,key,token) {
    return request(objectUrl(p),'GET',key,token);
  }
  async function remove(p,key,token) {
    return request('/storage/v1/object/'+BUCKET,'DELETE',key,token,
      JSON.stringify({prefixes:[p]}),'application/json');
  }
  function expect(ok,message){if(!ok) throw Error(message);log(message,'ok')}
  $('run').addEventListener('click',async()=>{
    const key=$('key').value.trim(), emailA=$('emailA').value.trim(),
          emailB=$('emailB').value.trim();
    let passwordA=$('passA').value,passwordB=$('passB').value;
    $('passA').value='';$('passB').value='';
    $('log').replaceChildren();
    if(!key.startsWith('sb_publishable_') || !emailA || !emailB || !passwordA || !passwordB){
      log('Preencha a chave publicável e as duas contas.','bad');return;
    }
    $('run').disabled=true;
    let a,b,pa,pb,uploadedA=false,uploadedB=false,passed=false;
    try {
      a=await login(emailA,passwordA,key);
      b=await login(emailB,passwordB,key);
      passwordA=passwordB='';
      expect(a.id!==b.id,'As duas contas têm IDs diferentes.');
      const nonce=crypto.randomUUID();
      pa=path(a.id,nonce);pb=path(b.id,nonce);
      let response=await upload(pa,key,a.token);
      expect(response.ok,'Conta A enviou imagem à própria pasta (HTTP '+response.status+').');
      uploadedA=true;
      response=await upload(pb,key,b.token);
      expect(response.ok,'Conta B enviou imagem à própria pasta (HTTP '+response.status+').');
      uploadedB=true;
      response=await download(pa,key,a.token);
      expect(response.ok && (await response.blob()).size>0,'A leu sua própria imagem.');
      response=await download(pb,key,b.token);
      expect(response.ok && (await response.blob()).size>0,'B leu sua própria imagem.');
      response=await download(pb,key,a.token);
      expect(response.status===400 || response.status===401 || response.status===403 || response.status===404,
        'A foi impedida de ler a imagem de B (HTTP '+response.status+').');
      response=await download(pa,key,b.token);
      expect(response.status===400 || response.status===401 || response.status===403 || response.status===404,
        'B foi impedida de ler a imagem de A (HTTP '+response.status+').');
      response=await request('/storage/v1/object/sign/'+BUCKET+'/'+pb,'POST',key,a.token,
        JSON.stringify({expiresIn:60}),'application/json');
      expect(!response.ok,'A foi impedida de criar link assinado para a imagem de B (HTTP '+response.status+').');
      response=await request('/storage/v1/object/sign/'+BUCKET+'/'+pa,'POST',key,b.token,
        JSON.stringify({expiresIn:60}),'application/json');
      expect(!response.ok,'B foi impedida de criar link assinado para a imagem de A (HTTP '+response.status+').');
      response=await upload(b.id+'/curio-storage-test-blocked-'+nonce+'.png',key,a.token);
      expect(!response.ok,'A foi impedida de enviar imagem à pasta de B (HTTP '+response.status+').');
      response=await request('/storage/v1/object/public/'+BUCKET+'/'+pa,'GET',key,null);
      expect(!response.ok,'O bucket não permite acesso público (HTTP '+response.status+').');
      passed=true;
      log('PASS: upload e leitura próprios permitidos; acesso cruzado e público bloqueados.','ok');
    } catch(error) {
      log('FALHOU: '+(error?.message||String(error)),'bad');
    } finally {
      passwordA=passwordB='';
      if(uploadedA){
        try{const r=await remove(pa,key,a.token);log(r.ok?'Imagem de A removida.':'Não consegui remover a imagem de A (HTTP '+r.status+').',r.ok?'ok':'bad')}
        catch{log('Não consegui remover a imagem de A.','bad')}
      }
      if(uploadedB){
        try{const r=await remove(pb,key,b.token);log(r.ok?'Imagem de B removida.':'Não consegui remover a imagem de B (HTTP '+r.status+').',r.ok?'ok':'bad')}
        catch{log('Não consegui remover a imagem de B.','bad')}
      }
      if(!passed) log('Se houve falha, mande apenas o texto do resultado; nunca as senhas ou a chave secreta.','info');
      a=b=null;
      $('run').disabled=false;
    }
  });
})();
</script>
</html>
