name: Android release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    environment: android-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm run android:sync
      - name: Build signed bundle
        shell: bash
        env:
          CURIO_KEYSTORE_BASE64: ${{ secrets.CURIO_KEYSTORE_BASE64 }}
          CURIO_KEYSTORE_PASSWORD: ${{ secrets.CURIO_KEYSTORE_PASSWORD }}
          CURIO_KEY_ALIAS: ${{ secrets.CURIO_KEY_ALIAS }}
          CURIO_KEY_PASSWORD: ${{ secrets.CURIO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CURIO_KEYSTORE_BASE64"
          export CURIO_KEYSTORE_PATH="$RUNNER_TEMP/curio-upload.jks"
          trap 'rm -f "$CURIO_KEYSTORE_PATH"' EXIT
          printf '%s' "$CURIO_KEYSTORE_BASE64" | base64 --decode > "$CURIO_KEYSTORE_PATH"
          chmod 600 "$CURIO_KEYSTORE_PATH"
          cd android
          bash gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: curio-play-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
